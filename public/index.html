<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Blockly.IO</title>
    <link href="https://cdn.jsdelivr.net/gh/woodle87/paper2@main/public/changa.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/woodle87/paper2@main/public/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/woodle87/paper2@main/bundle.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        
        #main-ui {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #222;
        }
        
        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
        }
        
        .hidden {
            display: none;
        }
        
        #begin h1 {
            margin: 20px 0;
            font-size: 2.5em;
        }
        
        #begin input {
            padding: 10px;
            font-size: 1em;
            margin: 10px 0;
            border: 2px solid #4CAF50;
            border-radius: 4px;
        }
        
        #begin button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 10px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        #begin button:hover {
            background-color: #45a049;
        }
        
        #error {
            color: #ff6b6b;
            display: block;
            margin-top: 10px;
        }
        
        #begin a {
            color: #4CAF50;
            text-decoration: none;
        }
        
        #begin a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <canvas id="main-ui"></canvas>
    <div id="stats" style="opacity: 0" class="fullscreen hidden"></div>
    <div id="begin" style="opacity: .99999" class="fullscreen">
        <div class="center">
            <h1>Blockly.IO!</h1>
            <small>Todo: replace ^^^ with a picture. Work in progress.</small><br>
            
            <h1>Enter your name</h1>
            <input autocomplete="off" id="name" placeholder="An awesome name!" type="text">
            <button type="button">Play!</button>
            <div>
                <small id="error">Your browser does not support JavaScript!</small>
            </div>
            <small>Visit the open-source code on <a href="https://github.com/woodle87/paper2" target="_blank">GitHub</a>!</small>
        </div>
    </div>
</body>
</html>
